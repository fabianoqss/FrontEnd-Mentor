<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact Form</title>
  <link rel="stylesheet" href="./output.css">
</head>

<body class="bg-[#E0F1E7] grid justify-center font-Karla">

  <form class="bg-white m-5 rounded-lg p-8 ">
    <h1 class="text-4xl text-grey-secondary  font-bold mb-10">Contact Us</h1>


    <div class="sm:grid flex gap-4">
      <div>
        <label class="text-lg   block mb-4" for="firstName"> First Name <span class="text-grey-secondary">*</span></label>
        <input type="text" id="firstName" name="firstName" class="rounded-lg  w-full p-3 border border-bordercolor hover:border-hoverborder outline-none focus:border-hoverborder cursor-pointer block">
      </div>

      <div>
        <label class="text-lg   block mb-4" for="lastname"> Last Name <span class="text-grey-secondary">*</span></label>
        <input type="text" id="lastname" name="lastname" class="rounded-lg  w-full p-3 border border-bordercolor hover:border-hoverborder outline-none focus:border-hoverborder cursor-pointer block">
      </div>
    </div>

    <label class="text-lg   block mb-4 mt-8" for="email"> Email Address <span class="text-grey-secondary">*</span></label>
    <input type="email" id="email" name="email" class="rounded-lg  w-full p-3 border border-bordercolor hover:border-hoverborder outline-none focus:border-hoverborder cursor-pointer block">

    <label class="text-lg font-Karla  block mb-4 mt-8" for="email"> Query Type <span class="text-grey-secondary">*</span></label>

    <div class="sm:grid flex gap-4">
      <div class="radio border hover:border-hoverborder p-3 border-bordercolor rounded-lg cursor-pointer w-full">
        <input type="radio" id="generalenquiry" name="retirada " class="mr-2" />
        <label for="generalenquiry">General Enquiry</label>
      </div>
      <div class="radio border hover:border-hoverborder p-3 border-bordercolor rounded-lg cursor-pointer w-full">
        <input type="radio" id="supportrequest" name="retirada" class="mr-2" />
        <label for="supportrequest">Support Request</label>
      </div>
    </div>

    <label class="text-lg   block mb-4 mt-8" for="message"> Message <span class="text-grey-secondary">*</span></label>
    <textarea name="message" id="message " rows="3" class="rounded-lg  w-full p-4 border border-bordercolor hover:border-hoverborder outline-none focus:border-hoverborder resize-none cursor-pointer block"></textarea>

    <div class="flex mt-8 items-center gap-2">
      <input type="checkbox" id="consent">
      <label class="text-lg   block cursor-pointer" for="consent"> I consent to being contacted by the team <span class="text-grey-secondary">*</span></label>
    </div>

    <button class="text-white font-bold py-5 bg-button-primary w-full mt-10 rounded-lg hover:bg-grey-secondary cursor-pointer"> Submit </button>

  </form>

</body>

</html>
