<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact Form</title>
  <link rel="stylesheet" href="./output.css">
</head>

<body class="bg-[#E0F1E7] grid justify-center font-Karla">

  <form class="bg-white m-5 rounded-lg p-8 w-full">
    <h1 class="text-4xl text-grey-secondary  font-bold mb-10">Contact Us</h1>

    <!----------------------              First Name and Last Name            -->

    <div class="grid grid-cols-2 sm:grid-cols-1 gap-4">
      <div>
        <label class="text-lg   block mb-3" for="firstName"> First Name <span class="text-grey-secondary">*</span></label>
        <input type="text" id="firstName" name="firstName" class="rounded-lg  w-full p-3 border border-bordercolor hover:border-hoverborder outline-none focus:border-hoverborder cursor-pointer block">
      </div>

      <div>
        <label class="text-lg   block mb-3" for="lastname"> Last Name <span class="text-grey-secondary">*</span></label>
        <input type="text" id="lastname" name="lastname" class="rounded-lg  w-full p-3 border border-bordercolor hover:border-hoverborder outline-none focus:border-hoverborder cursor-pointer block">
      </div>
    </div>

    <label class="text-lg   block mb-3 mt-8" for="email"> Email Address <span class="text-grey-secondary">*</span></label>
    <input type="email" id="email" name="email" class="rounded-lg  w-full p-3 border border-bordercolor hover:border-hoverborder outline-none focus:border-hoverborder cursor-pointer block">

    <label class="text-lg font-Karla  block mb-3 mt-8" for="email"> Query Type <span class="text-grey-secondary">*</span></label>


    <!----------------------              QUERY TYPE            -->

    <div class="sm:grid flex gap-4">


      <label class="flex items-center radio border hover:border-hoverborder p-3 border-bordercolor rounded-lg cursor-pointer w-full hover:bg-[#E0F1E7]" for="generalenquiry">
        <input type="radio" id="generalenquiry" name="choose" class="mr-2 hidden peer" />
        <span class="inline-block w-4 h-4 mr-2 border-2 border-bordercolor rounded-full peer-checked:border-hoverborder peer-checked:bg-hoverborder"></span>
        General Enquiry
      </label>


      <label class="flex items-center radio border hover:border-hoverborder p-3 border-bordercolor rounded-lg cursor-pointer w-full hover:bg-[#E0F1E7]" for="supportrequest">
        <input type="radio" id="supportrequest" name="choose" class="mr-2 hidden peer" />
        <span class="inline-block w-4 h-4 mr-2 border-2 border-bordercolor rounded-full peer-checked:border-hoverborder peer-checked:bg-hoverborder"></span>
        Support Request
      </label>

      <!----------------------              MESSAGE           -->
    </div>

    <label class="text-lg   block mb-3 mt-8" for="message"> Message <span class="text-grey-secondary">*</span></label>
    <textarea name="message" id="message " rows="3" class="rounded-lg  w-full p-4 border border-bordercolor hover:border-hoverborder outline-none focus:border-hoverborder resize-none cursor-pointer block"></textarea>

    <label class="flex items-center text-lg cursor-pointer mt-8 gap-2" for="consent">
      <input type="checkbox" id="consent" class="hidden peer">
      <span class="inline-block w-4 h-4 mr-2 border-2 border-bordercolor peer-checked:bg-hoverborder peer-checked:border-hoverborder"></span>
      I consent to being contacted by the team <span class="text-grey-secondary">*</span>
    </label>


    <button class="text-white font-bold py-5 bg-button-primary w-full mt-10 rounded-lg hover:bg-grey-secondary cursor-pointer"> Submit </button>

  </form>

</body>

</html>
