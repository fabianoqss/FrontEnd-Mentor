<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact Form</title>
  <link rel="stylesheet" href="./output.css">
</head>

<body class="bg-[#E0F1E7]">

  <form class="bg-white m-5 rounded-lg p-8" action="">
    <h1 class="text-4xl text-grey-secondary font-Karla font-bold mb-10">Contact Us</h1>


    <div class="grid">
      <label class="text-lg font-Karla font-normal block mb-4" for="firstName"> First Name <span class="text-grey-secondary">*</span></label>
      <input type="text" id="firstName" name="firstName" class="rounded-xl  w-full p-4 border border-bordercolor hover:bg-hoverborder cursor-pointer block">

      <label class="text-lg font-Karla font-normal block mb-4 sm:mt-8" for="lastname"> Last Name <span class="text-grey-secondary">*</span></label>
      <input type="text" id="lastname" name="lastname" class="rounded-xl  w-full p-4 border border-bordercolor hover:bg-hoverborder cursor-pointer block">
    </div>

    <label class="text-lg font-Karla font-normal block mb-4 sm:mt-8" for="email"> Email Address <span class="text-grey-secondary">*</span></label>
    <input type="email" id="email" name="email" class="rounded-xl  w-full p-4 border border-bordercolor hover:bg-hoverborder cursor-pointer block">

    <label class="text-lg font-Karla font-normal block mb-4 sm:mt-8" for="email"> Query Type <span class="text-grey-secondary">*</span></label>

    <div>
      <div class="radio">
        <input type="radio" id="generalenquiry" name="retirada" />
        <label for="generalenquiry">General Enquiry</label>
      </div>
      <div class="radio">
        <input type="radio" id="supportrequest" name="retirada" />
        <label for="supportrequest">Support Request</label>
      </div>
    </div>

    <label class="text-lg font-Karla font-normal block mb-4 sm:mt-8" for="message"> Message <span class="text-grey-secondary">*</span></label>
    <textarea name="message" id="message " rows="10" class="rounded-xl  w-full p-4 border border-bordercolor hover:bg-hoverborder cursor-pointer block"></textarea>

    <div class="flex mt-8 items-center gap-2">
      <input type="checkbox" id="consent">
      <label class="text-lg font-Karla font-normal block" for="consent"> I consent to being contacted by the team <span class="text-grey-secondary">*</span></label>
    </div>
    <button> Submit </button>

  </form>

</body>

</html>
