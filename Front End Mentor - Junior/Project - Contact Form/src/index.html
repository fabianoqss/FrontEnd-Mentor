<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact Form</title>
  <link rel="stylesheet" href="./output.css">
</head>

<body class="bg-[#E0F1E7] grid place-items-center font-Karla min-h-screen px-5">

  <form id="forms" class="grid gap-8 bg-white rounded-lg p-8 w-full max-w-custom">
    <h1 class="text-4xl text-grey-secondary  font-bold">Contact Us</h1>

    <!----------------------              First Name and Last Name            -->

    <div class="grid grid-cols-2 sm:grid-cols-1 gap-4">
      <div>
        <label class="text-lg block mb-3" for="firstName"> First Name <span class="text-grey-secondary">*</span></label>
        <input type="text" id="firstName" name="firstName" class="rounded-lg  w-full p-3 border border-bordercolor hover:border-hoverborder outline-none focus:border-hoverborder cursor-pointer block" required>
        <span class="text-red text-lg hidden mt-2"></span>
      </div>

      <div>
        <label class="text-lg block mb-3" for="lastname"> Last Name <span class="text-grey-secondary">*</span></label>
        <input type="text" id="lastname" name="lastname" class="rounded-lg  w-full p-3 border border-bordercolor hover:border-hoverborder outline-none focus:border-hoverborder cursor-pointer block" required>
        <span class="text-red text-lg mt-2 hidden"></span>
      </div>
    </div>

    <div>
      <label class="text-lg block mb-3" for="email"> Email Address <span class="text-grey-secondary">*</span></label>
      <input type="email" id="email" name="email" class="rounded-lg  w-full p-3 border border-bordercolor hover:border-hoverborder outline-none focus:border-hoverborder cursor-pointer block" required>
    </div>


    <!----------------------              QUERY TYPE            -->
    <div>
      <label class="text-lg font-Karla block mb-3" for="email"> Query Type <span class="text-grey-secondary">*</span></label>

      <div class="sm:grid flex gap-4">


        <label class="flex items-center radio border hover:border-hoverborder p-3 border-bordercolor rounded-lg cursor-pointer w-full hover:bg-[#E0F1E7] " for="generalenquiry">
          <input type="radio" id="generalenquiry" name="choose" class="w-4 h-4 mr-2 border-2 border-bordercolor rounded-full" />
          General Enquiry
        </label>


        <label class="flex items-center radio border hover:border-hoverborder p-3 border-bordercolor rounded-lg cursor-pointer w-full hover:bg-[#E0F1E7]" for="supportrequest">
          <input type="radio" id="supportrequest" name="choose" class="w-4 h-4 mr-2 border-2 border-bordercolor text-hoverborder" />
          Support Request
        </label>
      </div>
    </div>


    <!----------------------              MESSAGE           -->
    <div>
      <label class="text-lg   block mb-3" for="message"> Message <span class="text-grey-secondary">*</span></label>
      <textarea name="message" id="message " rows="3" class="rounded-lg  w-full p-4 border border-bordercolor hover:border-hoverborder outline-none focus:border-hoverborder resize-none cursor-pointer block"></textarea>
    </div>
    <!----------------------              Contacted           -->

    <label class="flex items-center text-lg cursor-pointer  gap-2" for="consent">
      <input type="checkbox" id="consent" class="w-4 h-4 border-2 accent-hoverborder mr-2 rounded-none">
      I consent to being contacted by the team <span class="text-grey-secondary">*</span>
    </label>

    <!----------------------              Button           -->

    <button id="btnsummit" class="text-white font-bold py-5 bg-button-primary w-full  rounded-lg hover:bg-grey-secondary cursor-pointer"> Submit </button>

  </form>

  <script src="./js/extrairdados.js"></script>
</body>

</html>
